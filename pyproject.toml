[project]
name = "khatm"
version = "0.1.0"
description = "Build a cast-silver seal ring from its design parameters and seal references"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "scikit-image",
    "scipy",
    "shapely",
]

[project.scripts]
khatm = "khatm.cli:main"

[dependency-groups]
dev = ["fake-bpy-module-4.5", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
ignore = [
    "N801", # Blender requires class names like KHATM_OT_rebuild
    "N802",
    "N803",
    "N806", # geometry code uses R_FINGER-style names for derived constants
    "RUF001", # the inscription code names Arabic letters
    "RUF002",
    "RUF003",
]

[tool.ty.environment]
python-version = "3.11"

# fake-bpy-module types most bpy lookups as Optional and node sockets without
# default_value, so those rules are off for the Blender scripts only.
[[tool.ty.overrides]]
include = ["src/khatm/blender/**"]

[tool.ty.overrides.rules]
missing-union-attribute = "ignore"
missing-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
