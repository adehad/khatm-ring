name: Publish viewer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  # The viewer's WGSL port of the ring's distance field, against ring_sdf.py at
  # the build commit the published STL names.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: model
        run: |
          header=$(xz -dc model/khatm-ring.stl.xz | head -c 80)
          commit=$(sed -n 's/.*build=\([^ ]*\).*/\1/p' <<<"$header")
          if [[ -z "$commit" || "$commit" == *+ ]]; then
            echo "::error::the STL names no clean build commit: $header"
            exit 1
          fi
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: build
          fetch-depth: 0
          path: build-branch
      - run: git -C build-branch checkout --detach ${{ steps.model.outputs.commit }}
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: oven-sh/setup-bun@v2
      - working-directory: site
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps --no-shell chromium
      - working-directory: site
        env:
          KHATM_BUILD: ${{ github.workspace }}/build-branch
          KHATM_SWIFTSHADER: "1"
        run: bun test

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, parity]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
